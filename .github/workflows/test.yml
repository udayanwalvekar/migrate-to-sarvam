name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tomli (Python < 3.11)
        if: matrix.python-version == '3.9'
        run: pip install tomli
      - name: Run test suite
        run: python tests/test_migrate.py -v
      - name: Dry-run smoke (script entrypoint)
        run: python skills/migrate-to-sarvam/scripts/migrate.py --home /tmp/empty-home
